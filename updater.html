/* Bootloader V3.x serial protocol */
const BTL_MAGIC = 0x81;
const BTL_ID_REQUEST = 0x02;
const BTL_ID_RESPONSE = 0x82;
const BTL_FW_UPDATE_REQUEST = 0x03;
const BTL_FW_UPDATE_RESPONSE = 0x83;
const BTL_FW_DATA_REQUEST = 0x04;
const BTL_FW_DATA_RESPONSE = 0x84;

const COM_STATE_INIT = 'com_state_init';
const COM_STATE_VX_WAIT_RESET_RSP = 'com_state_vx_wait_reset_rsp';
const COM_STATE_VX_WAIT_TIMER = 'com_state_vx_wait_timer';
const COM_STATE_V3_WAIT_ID_RSP = 'com_state_v3_wait_id_rsp';
const COM_STATE_V3_WAIT_ID_RSP_AFTER_UPDATE = 'com_state_v3_wait_id_rsp_after_update';
const COM_STATE_V3_WAIT_SYNC_RSP = 'com_state_v3_wait_sync_rsp';
const COM_STATE_V3_WAIT_DATA_REQ = 'com_state_v3_wait_data_req';
const COM_STATE_V3_WAIT_ASCII = 'com_state_v3_wait_ascii'
//const COM_STATE_DEV_SELECTED = 'com_state_dev_selected'

const app = {
    dbg: false,
    state: COM_STATE_INIT,
    firmwareVersions: {},
    rx : {
        bufpos: 0,
        crc: 0,
        escaped: 0,
        buf: []
    }
};

let portReader;
let portWriter;

};

let keepReading = true;

//-----------------------------------------------------------------------------
// SLIP protocol - ported from C version
const FR_END   = 0xC0;
const FR_ESC   = 0xDB;
const T_FR_END = 0xDC;
const T_FR_ESC = 0xDD;
const ASC_FLAG = 0x01;

async function protSendFlagged(writer, data) {
    let len = data.length;
    let c = 0;
    let i = 0;
    let crc = 0;
    let arr = [];

    // put an end before the packet
    arr.push(FR_END);

    while (i < len) {
        c = data[i++];
        crc += c;

        switch (c) {
        case FR_ESC:
            arr.push(FR_ESC);
            arr.push(T_FR_ESC);
            break;
        case FR_END:
            arr.push(FR_ESC);
            arr.push(T_FR_END);
            break;
        default:
            arr.push(c);
            break;
        }
    }

    c = (~crc + 1) & 0xFF;
    if (c == FR_ESC) {
        arr.push(FR_ESC);
        arr.push(T_FR_ESC);
    } else if (c == FR_END) {
        arr.push(FR_ESC);
        arr.push(T_FR_END);
    } else {
        arr.push(c);
    }

    c = ((~crc + 1) >> 8) & 0xFF;
    if (c == FR_ESC) {
        arr.push(FR_ESC);
        arr.push(T_FR_ESC);
    } else if (c == FR_END) {
        arr.push(FR_ESC);
        arr.push(T_FR_END);
    } else {
        arr.push(c);
    }

    arr.push(FR_END);

    if (app.dbg) {
        let dbg = [];
        for (let i = 0; i < arr.length; i++)
            dbg.push(arr[i].toString(16));
        console.log("send:", dbg);
    }

    await writer.write(new Uint8Array(arr));
    await writer.ready;
}

function protReceiveFlagged(app, data)
{
    let c = 0;
    let pos = 0;
    let len = data.length;
    if (len == 0)
       return;

    let rx = app.rx;

    while (pos < len)
    {
        c = data[pos];
        pos++;

        switch (c) {
            case FR_END:
                if (rx.escaped) {
                    // invalid
                    rx.bufpos = 0;
                    rx.crc = 0;
                } else {
                    if (rx.bufpos >= 2) {
                        let crcvalid = 0;
                        // Checksum bytes are added to the checksum rx->crc - substract them here
                        rx.crc -= rx.buf[rx.bufpos-1];
                        rx.crc -= rx.buf[rx.bufpos-2];
                        // TODO clean this messy condition up
                        if ((((~(rx.crc) +1) & 0xFF) == rx.buf[rx.bufpos - 2]) &&
                            ((((~(rx.crc) +1) >> 8) & 0xFF) == rx.buf[rx.bufpos - 1])) {
                            crcvalid = 1;
                        }

                        if (crcvalid) {
                            onPacket(app, rx.buf.subarray(0, rx.bufpos - 2));
                        } else {
    //                        console.log("invalid CRC, rx.buf.pos", rx.bufpos);
                        }
                    }
                    rx.bufpos = 0;
                    rx.crc = 0;
                }
            rx.escaped &= ~ASC_FLAG;
            continue;

            case FR_ESC:
                rx.escaped |= ASC_FLAG;
                continue;
      }

      let cont = false;
      if (rx.escaped & ASC_FLAG) {
         // translate the 2 byte escape sequence back to original char
         rx.escaped &= ~ASC_FLAG;

         switch (c) {
            case T_FR_ESC: c = FR_ESC; break;
            case T_FR_END: c = FR_END; break;
            default:
                cont = true;
         }
      }

      if (cont)
        continue;

      /* we reach here with every byte for the buffer
         legacy BUG: checksum bytes are added but should not be */
      if (rx.bufpos < rx.buf.length) {
         rx.buf[rx.bufpos++] = c;
         rx.crc += c;
      }
   }
}

routes.waitdisconnect = async function routeWaitDisconnect() {

    const productName = sessionStorage.getItem('product_name');

    if (!productName || !app.deviceFilters) {
        navigateTo('#start');
        return;
    }

    loadViewTemplate('page_wait_disconnect');
   
    app.div.querySelector('#product_name').textContent = productName;

    app.disconnectHandler = (event) => {
        console.log("disconnect event:", event.target);
        navigator.serial.removeEventListener("disconnect", app.disconnectHandler);
        app.disconnectHandler = null;

        navigateTo('#waitunplugged');
    };

    navigator.serial.addEventListener("disconnect", app.disconnectHandler);
    
}

routes.waitunplugged = async function routeWaitUnplugged() {

    const productName = sessionStorage.getItem('product_name');

    if (!productName || !app.deviceFilters) {
        navigateTo('#start');
        return;
    }

    loadViewTemplate('page_disconnect_wait_secs');
   
    const durText = app.div.querySelector('#duration');
    app.div.querySelector('#product_name').textContent = productName;

    let duration = 10;

    durText.textContent = duration;

    app.unpluggedTimer = setInterval(() => {
        duration -= 1;
        durText.textContent = duration;
        if (duration === 0) {
            clearInterval(app.unpluggedTimer);
            app.unpluggedTimer = null;
            navigateTo('#waitreconnect');
        }
    }, 1000) ;
}

routes.waitreconnect = async function routeWaitReconnect() {

    const productName = sessionStorage.getItem('product_name');

    if (!productName || !app.deviceFilters) {
        navigateTo('#start');
        return;
    }

    loadViewTemplate('page_wait_reconnect');

    app.div.querySelector('#product_name').textContent = productName;

    app.connectHandler = (event) => {
        app.port = event.target;
        navigator.serial.removeEventListener("connect", app.connectHandler);
        app.connectHandler = null;
        navigateTo('#updating');
    };

    navigator.serial.addEventListener("connect", app.connectHandler);
}

routes.updating = async function routeUpdating() {

    const productName = sessionStorage.getItem('product_name');

    if (!productName || !app.port) {
        navigateTo('#start');
        return;
    }

    loadViewTemplate('page_updating');

    app.div.querySelector('#product_name').textContent = productName;
    const perc = app.div.querySelector('#percent');

    function cb(e) {
        if (e.t === 'get') {
            let total = e.offset + e.remaining;
            if (total > 0) {
                let norm = e.offset / total;
                let pc = (100 * norm).toFixed(0);
                perc.textContent = pc;

            }
        } else if (e.err) {
            console.log(e);
            navigateTo('#updatefailed');
        } else if (e.t === 'verified') {
            console.log(e);
            navigateTo('#updatedone');
        } else {
            console.log(e);
        }

    }

    try {
        await updateFirmwareV3(app, cb);
    } catch (e) {
        console.log(e);
        navigateTo('#updatefailed');
    }
}

// Parses an GCF file
function gcfParseFile(dv) {
    const res = {
        valid: false,
        dataOffset: 0,
        fileType: 0,
        targetAddress: 0,
        crc8: 0,
        crc32: 0,
        size: 0 // from GCF header
    };

    let pos = 0;
    const magic = dv.getUint32(pos, true);
    pos += 4;

    if (magic == 0xcafefeed) {
        res.valid = true;
        res.dataOffset = 14; // GCF header size
        res.fileType = dv.getUint8(pos);
        pos += 1;
        res.targetAddress = dv.getUint32(pos, true);
        pos += 4;
        res.size = dv.getUint32(pos, true);
        pos += 4;
        res.crc8 = dv.getUint8(pos);
        pos += 1;

        if (res.fileType == 60) {
            // magic1 is product specific
            // 0xDEC0DE02 Hive
            // 0xDEC0DE03 ConBee III
            res.magic1 = dv.getUint32(pos, true);
            pos += 4;

            const totalSize = dv.getUint32(pos, true);
            pos += 4;

            if (totalSize !== res.size) {
                res.valid = false;
            }

            const imageSize = dv.getUint32(pos, true);
            pos += 4;

            const imageType = dv.getUint32(pos, true);
            pos += 4;

            const imageTargetAddress = dv.getUint32(pos, true);
            pos += 4;

            const imagePlainSize = dv.getUint32(pos, true);
            pos += 4;

            res.crc32 = dv.getUint32(pos, true);
            pos += 4;
        } else if (res.fileType == 90) {
            // FLS-M
            // CRC32 is part of the header but not of the 'gcfFileSize'
            res.crc32 = dv.getUint32(pos, true);
            pos += 4;
            res.dataOffset += 4;
        } else {
            // unknown
            // ConBee 1 / RaspBee * / ConBee II currently not supported
            res.valid = false;
        }

        if (res.size != (dv.byteLength - res.dataOffset)) {
            res.valid = false;
        }


    }

    return res;
}

function onPacket(app, pkg) {

    if (app.dbg) {
        const d = Array.from(pkg).map(x => x.toString(16).padStart(2,'0')).join(' ');
        console.log(`packet: ${app.state}, [${d}]`);
    }

    if (app.state === COM_STATE_VX_WAIT_TIMER) {
        if (app.dbg) {
            console.log("ignoring packet during UART reset window:", app.state, pkg);
        }
    } else if (pkg[0] == BTL_MAGIC) {
        if (pkg[1] == BTL_FW_DATA_REQUEST && app.state == COM_STATE_V3_WAIT_DATA_REQ) {
            stopStateTimer();
            v3UpdateDataReq(app, pkg);
        } else if ((app.state == COM_STATE_V3_WAIT_ID_RSP) && pkg[1] == BTL_ID_RESPONSE) {
            stopStateTimer();
            setTimeout(() => {
                v3SendSyncReq(app);
                startStateTimer(responseTimeout, 5000);
            }, 201)
        } else if (app.state === COM_STATE_V3_WAIT_ID_RSP_AFTER_UPDATE && pkg[1] == BTL_ID_RESPONSE) {
            stopStateTimer();
            v3VerifyAppCRC32(app, pkg);
            app.state = COM_STATE_INIT;
        } else if (app.state === COM_STATE_V3_WAIT_SYNC_RSP && pkg[1] == BTL_FW_UPDATE_RESPONSE) {

            if (pkg[2] == 0) {
                app.state = COM_STATE_V3_WAIT_DATA_REQ;
                startStateTimer(responseTimeout, 5000);
            } else {
                console.log("BTL v3 sync failed with status", pkg[2]);
            }
            
        } else {
            console.log("unhandled packet: ", app.state, pkg);
        }

    } else if (pkg[0] == 0x0B && app.state == COM_STATE_VX_WAIT_RESET_RSP) {
        // 0x0B, // command: write parmater
        // the bootloader should now send a ID
        app.state = COM_STATE_V3_WAIT_ID_RSP;
        startStateTimer(responseTimeout, 5000);
        //app.state = COM_STATE_V3_WAIT_SYNC_RSP;

    }
}

async function readUntilClosed(app) {
    const port = app.port;
    if (!port.readable) {
        return;
    }
    portReader = port.readable.getReader();
    try {
        while (keepReading) {
            const { value, done } = await portReader.read();
            if (done) {
                // portReader.cancel() has been called.
                break;
            }
            // value is a Uint8Array.
            onReceivedData(app, value);
        }
    } catch (err) {
        console.log(err);
    } finally {
        // Always release the reader lock so the port can be closed later.
        portReader.releaseLock();
    }
}

function stopStateTimer() {
    if (app.stateTimer) {
        clearTimeout(app.stateTimer);
        app.stateTimer = null;
    }
}

function startStateTimer(callback, ms) {
    stopStateTimer();

    app.stateTimer = setTimeout(() => {
        app.stateTimer = null;
        callback();
    }, ms);
}

// Clear route-local resources (timers, event listeners) so they don't
// outlive the route they were created in. Called before each route renders.
function clearRouteCleanup() {
    if (app.unpluggedTimer) {
        clearInterval(app.unpluggedTimer);
        app.unpluggedTimer = null;
    }
    if (app.disconnectHandler) {
        navigator.serial.removeEventListener("disconnect", app.disconnectHandler);
        app.disconnectHandler = null;
    }
    if (app.connectHandler) {
        navigator.serial.removeEventListener("connect", app.connectHandler);
        app.connectHandler = null;
    }
}

function v3VerifyAppCRC32(app, pkg) {
    let dv = new DataView(pkg.buffer);

    let btlVersion = dv.getUint32(2, true);
    let crc32 = dv.getUint32(6, true);

    if (crc32 === app.gcfHeader.crc32) {
        app.updateCallback({t: "verified", crc32, btlVersion});
    } else {
        app.updateCallback({err: "wrong_crc", crc32, btlVersion});
    }

    stopStateTimer();
}

function v3UpdateDataReq(app, pkg) {
    if (pkg.length !== 8) {
        // ignore
        console.log("invalid v3 data request length: ", pkg.length);
        return;
    }

    let dv = new DataView(pkg.buffer);
    let pos = 2; // behind BTL magic and command

    let offset = dv.getUint32(2, true);
    let length = dv.getUint16(6, true);

    if (offset === 0) { // update UI only at 30 fps
        app.updateThrottle = Date.now();
    }

    app.outpkg = app.outpkg || new ArrayBuffer(512);
    const arr = app.outpkg;

    dv = new DataView(arr);
    pos = 0;
    dv.setUint8(pos, BTL_MAGIC);
    pos += 1;
    dv.setUint8(pos, BTL_FW_DATA_RESPONSE);
    pos += 1;

    let status = 0; // sucess
    if ((offset + length) > app.gcfHeader.size) {
        status = 1; // error
    } else if (length > 256) {
        status = 2; // error
    } else if (length == 0) {
        status = 3; // error
    } else {
        // Assert(gcf->file.gcfFileSize > offset);
        app.remaining = app.gcfHeader.size - offset;
        // Assert(gcf->remaining < MAX_GCF_FILE_SIZE);
        length = length < app.remaining ? length : app.remaining;
        // Assert(length > 0);
    }

    dv.setUint8(pos, status);
    pos += 1;
    dv.setUint32(pos, offset, true);
    pos += 4;
    dv.setUint16(pos, length, true);
    pos += 2;

    if (status == 0) {
        if (app.remaining === length) {
           app.updateCallback({t: 'done'});
            app.state = COM_STATE_V3_WAIT_ID_RSP_AFTER_UPDATE;
        } else {
            const now = Date.now();
            if ((1000/30) < (now - app.updateThrottle)) {
                app.updateCallback({t: 'get', offset, length, remaining: app.remaining});
                app.updateThrottle = now;
            }
        }

        // Assert(length > 0)
        offset += app.gcfHeader.dataOffset;
        for (let i = 0; i < length; i++) {
            let byte = app.gcfFileDataView.getUint8(offset + i);
            dv.setUint8(pos, byte);
            pos += 1;
        }
        startStateTimer(responseTimeout, 3000);
    } else {
        app.updateCallback({err: `v3 data request error: ${status}`});
        app.state = COM_STATE_INIT;
    }

    return protSendFlagged(portWriter, new Uint8Array(arr.slice(0, pos)));
}

async function vxSendUartReset(app) {
    console.log("BTL vx UART reset request");
    //app.state = COM_STATE_VX_WAIT_RESET_RSP;
    app.state = COM_STATE_VX_WAIT_TIMER;

    const cmd = new Uint8Array([
        0x0B, // command: write parmater
        0x03, // seq
        0x00, // status
        0x0C, 0x00, // frame length (12)
        0x05, 0x00, // buffer length (5)
        0x26, // param: watchdog timout (2 seconds)
        0x02, 0x00, 0x00, 0x00
    ]);

    return protSendFlagged(portWriter, cmd);
}

async function v3SendIdReq(app) {
    console.log("BTL v3 ID request");
    app.state = COM_STATE_V3_WAIT_ID_RSP;
    return protSendFlagged(portWriter, new Uint8Array([0x81, 0x02]));
}

async function v3SendSyncReq(app) {
    console.log("BTL v3 sync request");
    app.state = COM_STATE_V3_WAIT_SYNC_RSP;

//     C0 81  03  00  12  20 00  00 00 00 00   5A     5C   67   B7   C5    B1 FC   C0 (19)
//        129, 3,  0, 18, 32, 0,  0, 0, 0, 0,  90,    92, 103, 183, 197
// recv_packet: 818300 (3)
// recv_packet: 8104000000004000 (8)

    const arr = new ArrayBuffer(15);
    const dv = new DataView(arr);
    let pos = 0;
    dv.setUint8(pos, BTL_MAGIC);
    pos += 1;
    dv.setUint8(pos, BTL_FW_UPDATE_REQUEST);
    pos += 1;
    dv.setUint32(pos, app.gcfHeader.size, true);
    pos += 4;
    dv.setUint32(pos, app.gcfHeader.targetAddress, true);
    pos += 4;
    dv.setUint8(pos, app.gcfHeader.fileType);
    pos += 1;
    dv.setUint32(pos, app.gcfHeader.crc32, true);
    pos += 4;

    return protSendFlagged(portWriter, new Uint8Array(arr));
}

function responseTimeout() {
    if (app.updateCallback) {
        app.updateCallback({err: 'rsp_timeout'});
    }
}

function closePort(app) {
    if (app.port) {
        keepReading = false;
        if (portReader) {
            portReader.cancel();
        }
    }
}

async function updateFirmwareV3(app, cb) {
    app.updateCallback = cb;
    const port = app.port;
    await port.open({baudRate: 115200});
    app.rx.buf = new Uint8Array(2048);
    portWriter = port.writable.getWriter();
    readUntilClosed(app).then(() => {
        portWriter.releaseLock();
        port.close();
        app.port = null;
        portReader = null;
        portWriter = null;
        console.log("port closed");
    });

    if (sessionStorage.getItem('uart_reset') === '1') {
        await vxSendUartReset(app);
        startStateTimer(async () => {
            //await v3SendSyncReq(app);
            app.state = COM_STATE_V3_WAIT_ID_RSP;
            startStateTimer(responseTimeout, 5000);
        }, 50);
    } else {
        startStateTimer(responseTimeout, 2000);
        app.state = COM_STATE_V3_WAIT_ID_RSP;
    }

function router() {
    const r = location.hash.split('XX');

    const hash = r[0].replace("#", "") || "start";

    // Clear route-local resources (timers, listeners) before rendering.
    clearRouteCleanup();

    if (hash in routes) {
        routes[hash]();
    } else {
        app.div.innerHTML = "<h1>404 - Page Not Found</h1>";
    }
}
